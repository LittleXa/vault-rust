[package]
name = "vault-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
colored = "3.1.1"
rand = "0.8"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
rpassword = "7.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1", features = ["derive"] }
